name: forja-dev
x-node: &node
  build:
    context: ..
    dockerfile: infra/Dockerfile.dev
  working_dir: /workspace/apps/api
  user: "${LOCAL_UID:?Run scripts/dev setup}:${LOCAL_GID:?Run scripts/dev setup}"
  environment:
    NPM_CONFIG_CACHE: /tmp/forja-npm-cache
  init: true
  volumes:
    - ../apps/api:/workspace/apps/api
    - type: volume
      source: api-dependencies
      target: /workspace/apps/api/node_modules
      volume: {nocopy: true}
    - ../.local/control:/run/forja-control
  env_file: ../.env
  secrets:
    - api-password
    - migration-password
    - development-data-key
  networks: [development]
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    entrypoint: [/bin/bash, /usr/local/share/forja/entrypoint.sh]
    command: [postgres, -c, log_statement=none, -c, log_min_messages=panic, -c, log_min_error_statement=panic, -c, log_parameter_max_length=0, -c, log_parameter_max_length_on_error=0]
    tmpfs: [/run/forja-init-secrets]
    environment:
      POSTGRES_USER: forja_admin
      POSTGRES_DB: forja
      POSTGRES_PASSWORD_FILE: /run/secrets/admin-password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [admin-password, api-password, migration-password]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/entrypoint.sh:/usr/local/share/forja/entrypoint.sh:ro
      - ./postgres/001-roles.sql:/docker-entrypoint-initdb.d/001-roles.sql:ro
    networks: [development]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U forja_admin -d forja']
      interval: 3s
      timeout: 3s
      retries: 20
    # No host database port; the API/tools use the isolated Compose network.
  tools:
    <<: *node
    profiles: [tools]
    command: [node, --version]
  api:
    <<: *node
    secrets: [api-password, development-data-key]
    command: [sh, -c, 'npm run build && npm run dev']
    ports: ['127.0.0.1:${FORJA_API_PORT:-3010}:${PORT:-3001}']
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:'+process.env.PORT+'/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
networks:
  development: {}
volumes:
  postgres-data: {}
  api-dependencies: {}
secrets:
  admin-password: {file: ../.local/secrets/admin-password}
  api-password: {file: ../.local/secrets/api-password}
  migration-password: {file: ../.local/secrets/migration-password}

  development-data-key: {file: ../.local/runtime/development-data-key}
